name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'version.txt'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: get_version
        run: |
          VERSION=$(cat version.txt | xargs)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create and push git tag
        run: |
          TAG="v${{ env.VERSION }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "Tag $TAG already exists on remote."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Build CLI Fat Jar
        run: ./gradlew :cli:jar

      - name: Create standalone executable and checksums
        run: |
          mv cli/build/libs/debroid-${{ env.VERSION }}.jar debroid.jar
          printf '#!/usr/bin/env bash\nexec java --enable-native-access=ALL-UNNAMED --add-exports=jdk.jdi/com.sun.tools.example.debug.expr=ALL-UNNAMED -jar "$0" "$@"\n' > stub.sh
          cat stub.sh debroid.jar > debroid
          chmod +x debroid
          rm stub.sh
          sha256sum debroid.jar > debroid.jar.sha256
          sha256sum debroid > debroid.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/read_changelog.sh "v${{ env.VERSION }}" > release_notes.md
          gh release create "v${{ env.VERSION }}" \
            debroid.jar \
            debroid \
            debroid.jar.sha256 \
            debroid.sha256 \
            --title "v${{ env.VERSION }}" \
            --notes-file release_notes.md
