name: PR Changelog Update

on:
  pull_request:
    paths:
      - 'version.txt'

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Read new version
        id: get_version
        run: |
          VERSION=$(cat version.txt | xargs)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update Changelog
        run: |
          ./scripts/update_changelog.sh "v${{ env.VERSION }}"

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update CHANGELOG for v${{ env.VERSION }}"
            git push
          fi

      - name: Post Changelog Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGELOG_CONTENT=$(./scripts/read_changelog.sh "v${{ env.VERSION }}")
          
          # Use EOF to properly handle multi-line strings in GitHub Actions
          cat << 'EOF' > pr_comment.md
          ## 📦 Changelog for v${{ env.VERSION }}
          
          EOF
          
          echo "$CHANGELOG_CONTENT" >> pr_comment.md
          
          gh pr comment ${{ github.event.pull_request.number }} --body-file pr_comment.md
