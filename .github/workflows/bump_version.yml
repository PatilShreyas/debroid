name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version to bump to (e.g., 0.1.1)'
        required: true

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create branch
        run: |
          git checkout -b bump-v${{ github.event.inputs.version }}

      - name: Update version.txt
        run: |
          echo "${{ github.event.inputs.version }}" > version.txt

      - name: Update Changelog
        run: |
          ./scripts/update_changelog.sh "v${{ github.event.inputs.version }}"

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt CHANGELOG.md
          git commit -m "chore: bump version to v${{ github.event.inputs.version }} and update changelog"
          git push origin bump-v${{ github.event.inputs.version }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGELOG_CONTENT=$(./scripts/read_changelog.sh "v${{ github.event.inputs.version }}")
          
          cat << EOF > pr_body.md
          ## 📦 Version Bump to v${{ github.event.inputs.version }}
          
          Automated PR to bump version and update changelog.
          
          ### Changelog Preview
          EOF
          
          echo "$CHANGELOG_CONTENT" >> pr_body.md
          
          gh pr create \
            --title "chore: Bump version to v${{ github.event.inputs.version }}" \
            --body-file pr_body.md \
            --head bump-v${{ github.event.inputs.version }} \
            --base main
